
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FuelTrack</title>

    <!-- Browser Tab Icon -->
    <link
        rel="icon"
        type="image/png"
        href="/favicon.png"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <main class="container">

        <!-- App Header -->
        <header class="header">

            <h1>
                <img
                    src="/favicon.png"
                    alt="FuelTrack"
                    class="title-icon"
                >
                FuelTrack
            </h1>

            <p>
                Your Fuel Tracking. Simplified.
            </p>

        </header>


        <!-- Add Trip -->
        <section class="trip-form">

            <h2>Add Trip</h2>

            <form id="tripForm">

                <!-- Trip Name -->
                <div class="form-group">

                    <label for="tripName">
                        Trip Name
                    </label>

                    <input
                        type="text"
                        id="tripName"
                        placeholder="Example: Trip 1"
                        required
                    >

                </div>


                <!-- Distance -->
                <div class="form-group">

                    <label for="distance">
                        Total Distance (km)
                    </label>

                    <input
                        type="number"
                        id="distance"
                        placeholder="Example: 250"
                        min="0"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Mileage -->
                <div class="form-group">

                    <label for="mileage">
                        Average Mileage (km/L)
                    </label>

                    <input
                        type="number"
                        id="mileage"
                        placeholder="Example: 15"
                        min="0"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Fuel Price -->
                <div class="form-group">

                    <label for="fuelPrice">
                        Fuel Price (₹/L)
                    </label>

                    <input
                        type="number"
                        id="fuelPrice"
                        placeholder="Example: 105"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Calculate Button -->
                <button type="submit">
                    Calculate Trip
                </button>

            </form>

        </section>


        <!-- Trip History -->
        <section class="trip-history">

            <h2>Your Trips</h2>

            <div id="tripList"></div>

            <!-- Total Summary Button -->
            <button
                id="summaryButton"
                class="summary-button"
                type="button"
            >
                Total Summary
            </button>

        </section>

        <!-- Approximation Note -->
        <footer class="disclaimer">
            Fuel consumption and costs are approximate.
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="/script.js"></script>

</body>
</html>
